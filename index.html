<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimodal Debate Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #f4f4f5; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .panel { background: #18181b; border: 1px solid #27272a; border-radius: 12px; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        .highlight-support { border-left: 4px solid #22c55e; background: rgba(34, 197, 94, 0.05); }
        .highlight-refute { border-left: 4px solid #ef4444; background: rgba(239, 68, 68, 0.05); }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col p-4 gap-4">

    <!-- Top Navigation & Input -->
    <header class="panel flex items-center justify-between p-4 shadow-md shrink-0">
        <div class="flex items-center gap-4 w-1/3">
            <i class="fa-solid fa-scale-unbalanced text-2xl text-indigo-500"></i>
            <div>
                <h1 class="font-bold text-lg leading-tight text-white">Debate RAG Engine</h1>
                <p class="text-xs text-zinc-400 mono">v2.0 :: Vector Synthesis</p>
            </div>
        </div>
        
        <div class="w-1/2 flex gap-2">
            <input type="text" id="claimInput" disabled placeholder="Upload PDF to initialize vector space..." 
                class="flex-1 bg-zinc-900 border border-zinc-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500 disabled:opacity-50">
            <button id="sendBtn" disabled onclick="submitClaim()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2 rounded-lg font-semibold disabled:opacity-50 transition-colors">
                Evaluate
            </button>
        </div>
    </header>

    <!-- Split Pane Workspace -->
    <main class="flex-1 flex gap-4 overflow-hidden">
        
        <!-- Left Pane: Evidence & Ingestion -->
        <section class="w-1/3 flex flex-col gap-4">
            <!-- Upload Module -->
            <div class="panel p-6 shrink-0 text-center">
                <input type="file" id="fileInput" accept="application/pdf" class="hidden" onchange="handleFileUpload(this.files[0])">
                <button onclick="document.getElementById('fileInput').click()" class="w-full border-2 border-dashed border-zinc-600 hover:border-indigo-500 rounded-lg p-6 transition-colors flex flex-col items-center gap-2 text-zinc-400 hover:text-indigo-400">
                    <i class="fa-solid fa-file-arrow-up text-3xl"></i>
                    <span id="uploadText" class="font-semibold text-sm">Upload Knowledge Base (PDF)</span>
                </button>
            </div>
            
            <!-- ACTIVE DOCUMENTS WORKSPACE PANEL -->
            <div style="margin-top: 20px; background: #1a1c23; padding: 15px; border-radius: 8px; border: 1px solid #2d3748;">
                <h3 style="font-size: 14px; color: #a0aec0; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em;">Active Knowledge Base</h3>
                <ul id="document-list" style="list-style: none; padding: 0; margin: 0; font-size: 13px; color: #e2e8f0;">
                    <li style="color: #718096; font-style: italic;">No documents loaded yet...</li>
                </ul>
            </div>


            <!-- Visual Evidence Display -->
            <div class="panel flex-1 p-6 flex flex-col overflow-hidden">
                <h2 class="text-xs font-bold uppercase tracking-widest text-zinc-500 mb-4 border-b border-zinc-800 pb-2">Retrieved Visual Artifacts</h2>
                <div id="imageGallery" class="flex-1 overflow-y-auto custom-scroll flex flex-col gap-4">
                    <div class="text-sm text-zinc-600 italic text-center mt-10">Awaiting inference...</div>
                </div>
            </div>
        </section>

        <!-- Right Pane: Debate Synthesis -->
        <section class="w-2/3 panel flex flex-col overflow-hidden relative">
            <div class="bg-zinc-900 p-4 border-b border-zinc-800 flex justify-between items-center">
                <h2 class="text-sm font-bold text-zinc-300"><i class="fa-solid fa-microchip mr-2 text-indigo-400"></i>Inference Output</h2>
            </div>
            
            <div id="verdictOutput" class="flex-1 overflow-y-auto custom-scroll p-8 text-sm leading-relaxed text-zinc-300">
                <div class="h-full flex flex-col items-center justify-center text-zinc-600 gap-3">
                    <i class="fa-solid fa-bolt text-4xl"></i>
                    <p>Engine standby. Awaiting claim evaluation.</p>
                </div>
            </div>
        </section>

    </main>

    <script>
        async function handleFileUpload(file) {
            if (file.type !== "application/pdf") return alert("PDF only.");
            
            const uploadText = document.getElementById('uploadText');
            const claimInput = document.getElementById('claimInput');
            const sendBtn = document.getElementById('sendBtn');
            
            uploadText.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Ingesting vectors...`;
            claimInput.disabled = true; sendBtn.disabled = true;

            const formData = new FormData(); formData.append('file', file);

            try {
                const res = await fetch('/upload_pdf', { method: 'POST', body: formData });
                if(!res.ok) throw new Error("Ingestion failed");
                
                uploadText.innerHTML = `<span class="text-emerald-500"><i class="fa-solid fa-check"></i> Database Synchronized</span>`;
                claimInput.disabled = false; sendBtn.disabled = false;
                claimInput.placeholder = "Enter your claim here...";
                fetchActiveDocuments();
            } catch (err) {
                uploadText.innerHTML = `<span class="text-red-500"><i class="fa-solid fa-xmark"></i> Error processing PDF</span>`;
            }
        }
        
        async function fetchActiveDocuments() {
            try {
                const response = await fetch('/documents');
                const data = await response.json();
                const listEl = document.getElementById('document-list');

                if (data.documents && data.documents.length > 0) {
                    listEl.innerHTML = '';
                    data.documents.forEach(doc => {
                        // Clean up the timestamp prefix for clean UI display (e.g., "1793410020_3.pdf" -> "3.pdf")
                        const displayName = doc.includes('_') ? doc.split('_').slice(1).join('_') : doc;
                        listEl.innerHTML += `
                            <li style="padding: 8px 0; border-bottom: 1px solid #2d3748; display: flex; justify-content: space-between; align-items: center;">
                                <span style="color: #48bb78; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px;" title="${displayName}">
                                    ● ${displayName}
                                </span>
                                <button onclick="deleteDocument('${doc}')" style="background: #e53e3e; border: none; color: white; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;" title="Delete Document">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </li>`;
                    });

                    // THE FIX: Automatically unlock the input box and send button if documents are found
                    const claimInput = document.getElementById('claimInput');
                    const sendBtn = document.getElementById('sendBtn');
                    if (claimInput) claimInput.disabled = false;
                    if (sendBtn) sendBtn.disabled = false;

                } else {
                    listEl.innerHTML = `<li style="color: #718096; font-style: italic;">No documents loaded...</li>`;
                }
            } catch (e) {
                console.error("Failed to fetch documents", e);
            }
        }

        async function deleteDocument(filename) {
            if (!confirm(`Are you sure you want to delete ${filename}?`)) return;
    
            try {
                const res = await fetch(`/documents/${filename}`, { method: 'DELETE' });
                if (res.ok) {
                    console.log(`Deleted ${filename}`);
                    fetchActiveDocuments(); // Refresh the list instantly
                } else {
                    alert("Failed to delete document.");
                }
            } catch (err) {
                console.error("Error deleting document:", err);
            }
        }

        // Call it on page load and right after a successful PDF upload
        window.addEventListener('DOMContentLoaded', fetchActiveDocuments);
        
        function copyReport(btnElement) {
            const claimText = document.getElementById('reportClaim').innerText;
            const verdictText = document.getElementById('reportVerdict').innerText;
            const formattedReport = `--- RAG DEBATE REPORT ---\n\nCLAIM:\n${claimText}\n\nVERDICT:\n${verdictText}`;
            
            navigator.clipboard.writeText(formattedReport).then(() => {
                const copySvg = btnElement.querySelector('.copy-svg');
                const checkSvg = btnElement.querySelector('.check-svg');
                
                copySvg.classList.add('hidden');
                checkSvg.classList.remove('hidden');
                
                setTimeout(() => {
                    checkSvg.classList.add('hidden');
                    copySvg.classList.remove('hidden');
                }, 2000);
            }).catch(err => console.error("Failed to copy text: ", err));
        }

        async function submitClaim() {
            const input = document.getElementById('claimInput');
            const output = document.getElementById('verdictOutput');
            const gallery = document.getElementById('imageGallery');
            const claim = input.value.trim();
            if (!claim) return;

             input.disabled = true; document.getElementById('sendBtn').disabled = true;
    
             output.innerHTML = `<div class="flex items-center gap-3 text-indigo-400 font-mono text-sm"><i class="fa-solid fa-circle-notch fa-spin"></i> Processing multimodal inference...</div>`;
            gallery.innerHTML = `<div class="text-sm text-zinc-600 italic text-center mt-10">Scanning vector space...</div>`;

            try {
                const response = await fetch('/evaluate_claim', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ claim: claim })
                });
        
                const data = await response.json();
        
                // Parse the structured output using final_response (matching backend key)
                let rawText = data.final_response || "";
        
                // Fallback rendering if the model didn't perfectly follow the strict headings
                let htmlOutput = `<div class="whitespace-pre-wrap">${rawText}</div>`;
        
                // Advanced parsing for the contrast UI
                if(rawText.includes("### SUPPORTING EVIDENCE") && rawText.includes("### REFUTING EVIDENCE")) {
                    const supportSplit = rawText.split("### REFUTING EVIDENCE");
                    const supportText = supportSplit[0].replace("### SUPPORTING EVIDENCE", "").trim();
                    const refuteSplit = supportSplit[1].split("### FINAL VERDICT");
                    const refuteText = refuteSplit[0].trim();
                    const verdictText = refuteSplit[1] ? refuteSplit[1].trim() : "";

                    htmlOutput = `
                        <div class="flex justify-between items-start mb-6 pb-4 border-b border-zinc-800/80">
                            <div class="pr-8">
                                <h3 class="text-zinc-500 uppercase font-bold text-xs tracking-wider mb-2">Analyzed Claim</h3>
                                <p class="text-zinc-100 text-lg font-medium leading-relaxed" id="reportClaim">"${claim}"</p>
                            </div>
                            <button onclick="copyReport(this)" class="shrink-0 text-zinc-400 hover:text-indigo-400 transition-colors p-2.5 bg-zinc-900 border border-zinc-800 rounded-lg hover:border-indigo-500/50 shadow-sm" title="Copy Synthesis">
                                <!-- Native SVG Copy Icon -->
                                <svg class="copy-svg" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                                </svg>
                                <!-- Native SVG Checkmark Icon (Hidden by default) -->
                                <svg class="check-svg hidden text-emerald-400" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12"/>
                                </svg>
                            </button>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-6 mb-6">
                            <!-- Support Card -->
                            <div class="bg-[#022c22]/40 border border-[#064e3b] rounded-xl p-5 shadow-inner">
                                <h4 class="text-emerald-400 font-semibold mb-4 flex items-center gap-2 border-b border-emerald-900/50 pb-3 text-sm tracking-wide">
                                    <i class="fa-solid fa-check-circle text-emerald-500"></i> SUPPORTING EVIDENCE
                                </h4>
                                <div class="text-zinc-300 text-sm leading-relaxed space-y-3 whitespace-pre-wrap">${supportText}</div>
                            </div>
                            
                            <!-- Refute Card -->
                            <div class="bg-[#4c0519]/40 border border-[#881337] rounded-xl p-5 shadow-inner">
                                <h4 class="text-rose-400 font-semibold mb-4 flex items-center gap-2 border-b border-rose-900/50 pb-3 text-sm tracking-wide">
                                    <i class="fa-solid fa-xmark-circle text-rose-500"></i> REFUTING EVIDENCE
                                </h4>
                                <div class="text-zinc-300 text-sm leading-relaxed space-y-3 whitespace-pre-wrap">${refuteText}</div>
                            </div>
                        </div>
                        
                        <!-- Synthesis Card -->
                        <div class="bg-gradient-to-br from-[#1e1b4b]/60 to-zinc-900 border border-[#3730a3]/60 rounded-xl p-6 shadow-[inset_0_1px_1px_rgba(255,255,255,0.05)] relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-1.5 h-full bg-indigo-500"></div>
                            <h4 class="text-indigo-400 font-semibold mb-3 uppercase tracking-widest text-xs flex items-center gap-2">
                                <i class="fa-solid fa-microchip"></i> Final Synthesis
                            </h4>
                            <div class="text-indigo-50 text-base font-medium leading-relaxed whitespace-pre-wrap" id="reportVerdict">${verdictText}</div>
                        </div>
                    `;
                }
        
                output.innerHTML = htmlOutput;

                // Render Images using image_context (matching backend key) with a safe fallback array
                const images = data.image_context || [];
                if (images.length > 0) {
                    gallery.innerHTML = images.map(img => `
                        <div class="bg-zinc-900 border border-zinc-700 rounded-lg p-2 overflow-hidden shadow-md">
                            <img src="/${img}?t=${Date.now()}" class="w-full h-auto object-contain bg-zinc-950 rounded cursor-pointer" onclick="window.open(this.src)" title="Click to view full size">
                        </div>
                    `).join('');
                } else {
                    gallery.innerHTML = `<div class="text-sm text-zinc-600 italic text-center mt-10">No visual artifacts retrieved for this claim.</div>`;
                }

            } catch (error) {
                output.innerHTML = `<div class="text-red-500">Inference Error: ${error.message}</div>`;
            }
    
            input.disabled = false; document.getElementById('sendBtn').disabled = false;
            input.value = ''; input.focus();
        }
        

        
    </script>
</body>
</html>
